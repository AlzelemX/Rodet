[workspace]
resolver = "2"
members = ["core", "app", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"


[workspace.dependencies]
devr-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }

[profile.release]
# Small and fast: DEVR+ should stay light.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
