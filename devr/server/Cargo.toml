[package]
name = "devr-server"
description = "DEVR+ over a WebSocket: open the editor in a browser, on this computer or another device"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
devr-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tower-http = { version = "0.6", features = ["fs"] }
