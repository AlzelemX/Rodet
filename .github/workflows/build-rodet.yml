name: Build Rodet

# Builds the Rodet toolchain for Windows, Linux and macOS and publishes it as
# one GitHub release:
#   rodetc     the compiler (stage1) and the standard library
#   rodetdoc   the documentation tool
#   rodet      Silk, the package manager (built from the `silk` sources)
#   rodet-analyzer  the language server
#
# All build inputs come from this repository: the source, the Silk sources, and
# the `deps-snapshot` release (stage0 compiler, prebuilt LLVM, vendored crates)
# fetched by rodet/setup-deps.py. Nothing is downloaded from rust-lang servers.

on:
  push:
    branches: [main]
    # Editing only the docs does not rebuild the compiler.
    paths-ignore:
      - '**.md'
      - 'docbook/**'
      - 'notebook/**'
      - 'devr/**'
      - '.github/workflows/devr.yml'
      - 'rodet/sync-status.py'
      - '.github/workflows/readme-status.yml'
      - '.github/workflows/docbook.yml'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-rodet
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use Ubuntu 24.04 on purpose: the compiler then runs on
          # any distro with glibc 2.39 or newer (Ubuntu 24.04+, Debian 13+, ...).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: ""
            py: python3
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: ""
            py: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
            py: python
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            py: python3
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: ""
            py: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      # Where Silk's sources live (a branch of this repository until Silk has
      # its own repository).
      SILK_REPO: ${{ github.repository }}
      SILK_REF: silk
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      PY: ${{ matrix.py }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/julia* /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          df -h /
          # Keep only the selected Xcode (compare real paths: Xcode.app is often a symlink).
          KEEP=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$KEEP" ] || sudo rm -rf "$x"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet \
                      ~/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator || true
          df -h /

      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout Rodet
        uses: actions/checkout@v5

      - name: Checkout Silk
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SILK_REPO }}
          ref: ${{ env.SILK_REF }}
          path: silk

      - name: Fetch build dependencies from deps-snapshot
        run: $PY rodet/setup-deps.py --target "$TARGET" --ci

      # GITHUB_ACTIONS is unset so bootstrap behaves like a local build
      # instead of assuming rust-lang's own CI setup.
      - name: Build stage1 compiler, standard library, rustdoc and rodet-analyzer
        run: |
          set -o pipefail
          # The build number in `rodetc --version` ("Rodet #19") makes every
          # release a different compiler for Silk, so it never reuses files
          # built by an older Rodet.
          env -u GITHUB_ACTIONS $PY x.py build library src/tools/rustdoc src/tools/rust-analyzer \
            --set "build.description=Rodet #${GITHUB_RUN_NUMBER}" 2>&1 | tee build.log

      # Silk is built by the stage0 toolchain from deps-snapshot.
      - name: Build Silk (the rodet command)
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends libssl-dev pkg-config > /dev/null
          fi
          export PATH="$PWD/build/$TARGET/stage0/bin:$PATH"
          cargo build --release --bin rodet --manifest-path silk/Cargo.toml 2>&1 | tee silk.log
          "silk/target/release/rodet$EXE" --version

      - name: Smoke test
        run: |
          set -o pipefail
          exec > >(tee smoke.log) 2>&1
          RODETC="build/$TARGET/stage1/bin/rustc$EXE"
          "$RODETC" -vV
          "$RODETC" --version | grep -E "^rodetc [0-9.]+ \(#[0-9]+"
          RODET_COMPAT=1 "$RODETC" --version | grep -F "(Rodet #"
          "$RODETC" rodet/examples/hello.rd -o "hello$EXE"
          "./hello$EXE"

      - name: Package
        run: |
          set -o pipefail
          exec > >(tee package.log) 2>&1
          # Stable asset names, so ".../releases/latest/download/<name>" always
          # points at the newest build (the Windows installer relies on it).
          NAME="rodet-${TARGET}"
          mkdir -p dist out
          # The sysroot links back into the source tree (lib/rustlib/src,
          # lib/rustlib/rustc-src); drop those, they only serve rust-analyzer.
          tar -C "build/$TARGET" \
              --exclude=stage1/lib/rustlib/src --exclude=stage1/lib/rustlib/rustc-src \
              -cf - stage1 | tar -C dist -xf -
          mv dist/stage1 dist/rodet
          # Rodet's names for the compiler and the documentation tool.
          mv "dist/rodet/bin/rustc$EXE" "dist/rodet/bin/rodetc$EXE"
          mv "dist/rodet/bin/rustdoc$EXE" "dist/rodet/bin/rodetdoc$EXE"
          # Silk, the package manager: the `rodet` command.
          cp "silk/target/release/rodet$EXE" dist/rodet/bin/
          # rodet-analyzer: the language server of DEVR+ (and of any editor).
          # Its proc-macro server is already in stage1/libexec.
          RA=$(ls build/$TARGET/stage*-tools-bin/rust-analyzer$EXE | tail -1)
          echo "rust-analyzer: $RA"
          cp "$RA" "dist/rodet/bin/rodet-analyzer$EXE"
          ls dist/rodet/libexec || echo "::warning::no proc-macro server in libexec"
          # The standard library's source, so the analyzer understands std.
          mkdir -p dist/rodet/lib/rustlib/src/rust
          tar -cf - --exclude='library/*/tests' --exclude='library/*/benches' \
              --exclude='library/stdarch/crates/*/tests' library \
            | tar -C dist/rodet/lib/rustlib/src/rust -xf -
          # The Doc Book of this version, in English and Arabic: DEVR+ shows it,
          # so the book always matches the installed language.
          BOOK=dist/rodet/share/doc/rodet/book
          mkdir -p "$BOOK/en" "$BOOK/ar"
          cp -R docbook/src/. "$BOOK/en/"
          cp -R docbook/ar/src/. "$BOOK/ar/"
          test -f "$BOOK/en/SUMMARY.md" && test -f "$BOOK/ar/SUMMARY.md"
          # The compiler's messages in other languages (RODET_LANG=ar).
          mkdir -p dist/rodet/share/rodet/i18n
          cp compiler/rodetc_errors/src/i18n/*.txt dist/rodet/share/rodet/i18n/
          cp rodet/examples/hello.rd dist/rodet/
          ls dist/rodet/bin
          du -sh dist/rodet
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip -mx=7 "../out/${NAME}.zip" rodet > /dev/null)
          else
            XZ_OPT="-T0 -6" tar -C dist -cJf "out/${NAME}.tar.xz" rodet
          fi
          "dist/rodet/bin/rodetc$EXE" --version > out/version.txt
          ls -lh out

      - name: Test the packaged toolchain with rodet
        run: |
          set -o pipefail
          exec > >(tee rodet-test.log) 2>&1
          export PATH="$PWD/dist/rodet/bin:$PATH"
          rodetc --version
          rodet --version
          rodetdoc --version
          cd "$RUNNER_TEMP"
          rodet new --vcs none rodet-demo
          cd rodet-demo
          ls
          test -f Silk.toml && test -f src/main.rd
          cat > src/main.rd <<'EOF'
          mod greet;
          fn main() {
              out!("{} {}", greet::hello(), std::env::consts::OS);
          }
          EOF
          cat > src/greet.rd <<'EOF'
          pub fn hello() -> &'static str { "rodet + Silk works on" }
          EOF
          rodet run
          test -f Silk.lock
          # A crates.io package with a build script that reads `$RUSTC --version`.
          rodet add rustversion
          cat >> src/main.rd <<'EOF'
          #[rustversion::since(1.60)]
          fn _modern() {}
          EOF
          rodet run
          # rodet-analyzer must understand Rodet code without false errors.
          cat > src/main.rd <<'EOF'
          struct Parser<_a> { input: &_a str }
          impl<_a> Parser<_a> {
              fn rest(&self) -> &_a str { self.input }
          }
          fn longest(x: &str, y: &str) -> &{x, y} str { if x.len() >= y.len() { x } else { y } }
          fn area(width: u32, height: u32) -> u32 { width * height }
          fn open(path: &str, write: bool = false) -> String { format!("{path} {write}") }
          fn main() {
              let p = Parser { input: "hello" };
              let a: u32 = area(height = 4, width = 3);
              out!("{} {} {a} {}", p.rest(), longest("a", "bc"), open("x", write = true));
          }
          EOF
          rm -f src/greet.rd
          rodet run
          rodet-analyzer --version
          rodet-analyzer diagnostics .

      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          exec > >(tee installer.log) 2>&1
          dist/rodet/bin/rodetc.exe --edition 2024 -O -C target-feature=+crt-static \
              rodet/installer/main.rd -o "out/rodet_init.exe"
          ls -l out
          "out/rodet_init.exe" -y --from-file "out/rodet-$TARGET.zip"
          "$USERPROFILE/.rodet/bin/rodetc.exe" --version
          "$USERPROFILE/.rodet/bin/rodet.exe" --version
          powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | tr ';' '\n' | head -3
          "out/rodet_init.exe" -y --uninstall
          test ! -e "$USERPROFILE/.rodet"

      - name: Test the Linux/macOS installer
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          exec > >(tee installer.log) 2>&1
          sh rodet/installer/install.sh --from-file "out/rodet-$TARGET.tar.xz"
          "$HOME/.rodet/bin/rodetc" --version
          "$HOME/.rodet/bin/rodet" --version
          grep -h "Rodet installer" ~/.profile
          sh rodet/installer/install.sh --uninstall
          test ! -e "$HOME/.rodet"
          ! grep -q "Rodet installer" ~/.profile
          # The installer script is published once, next to the Linux x86_64 build.
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
            cp rodet/installer/install.sh "out/rodet_init.sh"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rodet-${{ matrix.target }}
          path: out/
          retention-days: 3
          compression-level: 0

      - name: Run Rodet UI tests (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -o pipefail
          env -u GITHUB_ACTIONS $PY x.py test tests/ui/rodet --stage 1 2>&1 | tee test.log

      # Job logs are not always reachable, so surface the important parts
      # as annotations on the run.
      - name: Report
        if: always()
        run: |
          report() { # title file lines
            [ -f "$2" ] || return 0
            msg=$(grep -v '^\s*$' "$2" | tail -n "$3" | cut -c1-300 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=$1 ($TARGET)::$msg"
          }
          grep -nE "^(error|warning|Building|Build completed)|download" build.log 2>/dev/null | head -n 40 > build-key.log || true
          report "build key lines" build-key.log 40
          report "build tail" build.log 60
          report "smoke test" smoke.log 40
          report "package" package.log 30
          report "silk build" silk.log 30
          report "rodet test" rodet-test.log 30
          report "installer" installer.log 40
          report "ui test tail" test.log 30
          echo "::notice title=disk ($TARGET)::$(df -h . | tail -1)"

  release:
    needs: build
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/publish-release.yml
