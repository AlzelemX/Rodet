name: Build Rust++

# Builds the Rust++ compiler (stage1 rustc + standard library) for Linux and
# Windows and publishes both as one GitHub release.
#
# All build inputs come from this repository: the source, and the
# `deps-snapshot` release (stage0 compiler, prebuilt LLVM, vendored crates)
# fetched by rustpp/setup-deps.py. Nothing is downloaded from rust-lang servers.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rustpp
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use Ubuntu 24.04 on purpose: the compiler then runs on
          # any distro with glibc 2.39 or newer (Ubuntu 24.04+, Debian 13+, ...).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: ""
            py: python3
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: ""
            py: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
            py: python
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            py: python3
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: ""
            py: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      PY: ${{ matrix.py }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/julia* /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          df -h /
          # Keep only the selected Xcode (compare real paths: Xcode.app is often a symlink).
          KEEP=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$KEEP" ] || sudo rm -rf "$x"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet \
                      ~/Library/Developer/CoreSimulator /Library/Developer/CoreSimulator || true
          df -h /

      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout Rust++
        uses: actions/checkout@v5

      - name: Fetch build dependencies from deps-snapshot
        run: $PY rustpp/setup-deps.py --target "$TARGET" --ci

      # GITHUB_ACTIONS is unset so bootstrap behaves like a local build
      # instead of assuming rust-lang's own CI setup.
      - name: Build stage1 compiler, standard library and rustdoc
        run: |
          set -o pipefail
          env -u GITHUB_ACTIONS $PY x.py build library src/tools/rustdoc 2>&1 | tee build.log

      - name: Smoke test
        run: |
          set -o pipefail
          exec > >(tee smoke.log) 2>&1
          RUSTC="build/$TARGET/stage1/bin/rustc$EXE"
          "$RUSTC" -vV
          "$RUSTC" --version | grep -F "(Rust++)"
          "$RUSTC" rustpp/examples/hello.rs -o "hello$EXE"
          "./hello$EXE"

      - name: Package
        run: |
          set -o pipefail
          exec > >(tee package.log) 2>&1
          # Stable asset names, so ".../releases/latest/download/<name>" always
          # points at the newest build (the Windows installer relies on it).
          NAME="rustpp-${TARGET}"
          mkdir -p dist out
          # The sysroot links back into the source tree (lib/rustlib/src,
          # lib/rustlib/rustc-src); drop those, they only serve rust-analyzer.
          tar -C "build/$TARGET" \
              --exclude=stage1/lib/rustlib/src --exclude=stage1/lib/rustlib/rustc-src \
              -cf - stage1 | tar -C dist -xf -
          mv dist/stage1 dist/rustpp
          # cargo comes from the stage0 snapshot (deps-snapshot release), so the
          # package is a complete toolchain: rustc, rustdoc, cargo, std.
          cp "build/$TARGET/stage0/bin/cargo$EXE" dist/rustpp/bin/
          cp rustpp/examples/hello.rs dist/rustpp/
          ls dist/rustpp/bin
          du -sh dist/rustpp
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip -mx=7 "../out/${NAME}.zip" rustpp > /dev/null)
          else
            XZ_OPT="-T0 -6" tar -C dist -cJf "out/${NAME}.tar.xz" rustpp
          fi
          "build/$TARGET/stage1/bin/rustc$EXE" --version > out/version.txt
          ls -lh out

      - name: Test the packaged toolchain with cargo
        run: |
          set -o pipefail
          exec > >(tee cargo-test.log) 2>&1
          export PATH="$PWD/dist/rustpp/bin:$PATH"
          rustc --version
          cargo --version
          rustdoc --version
          cd "$RUNNER_TEMP"
          cargo new --vcs none rustpp-demo
          cd rustpp-demo
          cat > src/main.rs <<'EOF'
          fn main() {
              out!("cargo + Rust++ works on {}", std::env::consts::OS);
          }
          EOF
          cat src/main.rs
          cargo run

      - name: Build and test the Windows installer
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          exec > >(tee installer.log) 2>&1
          dist/rustpp/bin/rustc.exe --edition 2024 -O -C target-feature=+crt-static \
              rustpp/installer/main.rs -o "out/rustup++_init.exe"
          ls -l out
          "out/rustup++_init.exe" -y --from-file "out/rustpp-$TARGET.zip"
          "$USERPROFILE/.rustpp/bin/rustc.exe" --version
          "$USERPROFILE/.rustpp/bin/cargo.exe" --version
          powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path','User')" | tr ';' '\n' | head -3
          "out/rustup++_init.exe" -y --uninstall
          test ! -e "$USERPROFILE/.rustpp"

      - name: Test the Linux/macOS installer
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          exec > >(tee installer.log) 2>&1
          sh rustpp/installer/install.sh --from-file "out/rustpp-$TARGET.tar.xz"
          "$HOME/.rustpp/bin/rustc" --version
          "$HOME/.rustpp/bin/cargo" --version
          grep -h "Rust++ installer" ~/.profile
          sh rustpp/installer/install.sh --uninstall
          test ! -e "$HOME/.rustpp"
          ! grep -q "Rust++ installer" ~/.profile
          # The installer script is published once, next to the Linux x86_64 build.
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
            cp rustpp/installer/install.sh "out/rustup++_init.sh"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: rustpp-${{ matrix.target }}
          path: out/
          retention-days: 3
          compression-level: 0

      - name: Run Rust++ UI tests (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -o pipefail
          env -u GITHUB_ACTIONS $PY x.py test tests/ui/rustpp --stage 1 2>&1 | tee test.log

      # Job logs are not always reachable, so surface the important parts
      # as annotations on the run.
      - name: Report
        if: always()
        run: |
          report() { # title file lines
            [ -f "$2" ] || return 0
            msg=$(grep -v '^\s*$' "$2" | tail -n "$3" | cut -c1-300 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=$1 ($TARGET)::$msg"
          }
          grep -nE "^(error|warning|Building|Build completed)|download" build.log 2>/dev/null | head -n 40 > build-key.log || true
          report "build key lines" build-key.log 40
          report "build tail" build.log 60
          report "smoke test" smoke.log 40
          report "package" package.log 30
          report "cargo test" cargo-test.log 30
          report "installer" installer.log 40
          report "ui test tail" test.log 30
          echo "::notice title=disk ($TARGET)::$(df -h . | tail -1)"

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*/*.tar.xz artifacts/*/*.zip artifacts/*/*.exe artifacts/*/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no builds to publish"; exit 1; fi
          VERSION=$(cat artifacts/*/version.txt | head -1)
          TAG="v$(echo "$VERSION" | awk '{print $2}')-rustpp.${GITHUB_RUN_NUMBER}"
          {
            echo "Rust++ compiler built from ${GITHUB_SHA}."
            echo
            echo "\`$VERSION\`"
            echo
            echo "## Windows: easiest way"
            echo
            echo "Download **\`rustup++_init.exe\`** and double-click it. It installs Rust++ (rustc, cargo, rustdoc)"
            echo "into \`%USERPROFILE%\\.rustpp\` and adds it to your PATH. Then in a new terminal:"
            echo
            echo '```'
            echo 'rustc --version'
            echo 'cargo new hello'
            echo 'cd hello'
            echo 'cargo run'
            echo '```'
            echo
            echo "Uninstall: \`rustup++_init.exe --uninstall\`"
            echo
            echo "## Linux and macOS"
            echo
            echo "In a terminal:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/${REPO}/releases/latest/download/rustup++_init.sh | sh"
            echo '```'
            echo
            echo "Then open a new terminal and run \`rustc --version\`."
            echo "Supported: Linux x86_64 and ARM64 (glibc 2.39+), macOS Apple Silicon and Intel."
            echo "Uninstall: \`curl -fsSL https://github.com/${REPO}/releases/latest/download/rustup++_init.sh | sh -s -- --uninstall\`"
          } > notes.md
          gh release create "$TAG" "${files[@]}" -R "$REPO" \
            --target "$GITHUB_SHA" --title "Rust++ $TAG" --notes-file notes.md --latest
