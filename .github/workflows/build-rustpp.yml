name: Build Rust++

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rustpp
  cancel-in-progress: true

env:
  # Upstream rust-lang/rust commit this fork is based on. The build grafts the
  # fork's root commit onto it so bootstrap can find a bors merge commit and
  # download the matching prebuilt LLVM (building LLVM would take hours).
  UPSTREAM_SHA: c303e414dd813ab090055754d0be647054fce70a
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/local/julia* /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout Rust++
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Link history to upstream rust-lang/rust
        run: |
          git fetch --no-tags --depth 1 https://github.com/rust-lang/rust "$UPSTREAM_SHA"
          ROOT=$(git rev-list --max-parents=0 HEAD)
          git replace --graft "$ROOT" "$UPSTREAM_SHA"
          git log --format='%h %an: %s' -4

      - name: Write bootstrap.toml
        run: |
          cat > bootstrap.toml <<'EOF'
          profile = "compiler"
          change-id = "ignore"

          [build]
          compiler-docs = false

          [rust]
          # Release-like compiler: faster to use, no incremental cache on CI.
          debug-assertions = false
          debug-logging = false
          incremental = false

          [llvm]
          download-ci-llvm = true
          EOF
          cat bootstrap.toml

      # GITHUB_ACTIONS is unset so bootstrap uses its local-checkout logic
      # (find the latest bors commit) instead of rust-lang's own CI layout.
      - name: Build stage1 compiler + standard library
        run: |
          set -o pipefail
          env -u GITHUB_ACTIONS python3 x.py build library 2>&1 | tee build.log

      - name: Smoke test
        run: |
          set -o pipefail
          exec > >(tee smoke.log) 2>&1
          ls -la build/host/stage1/bin || true
          RUSTC=build/host/stage1/bin/rustc
          $RUSTC -vV
          $RUSTC --version | grep -F "(Rust++)"
          $RUSTC rustpp/examples/hello.rs -o hello
          ./hello

      - name: Package
        id: pkg
        run: |
          VERSION=$(cat src/version)
          NAME="rustpp-${VERSION}-${GITHUB_RUN_NUMBER}-${TARGET}"
          mkdir -p dist
          cp -rL build/host/stage1 dist/rustpp
          cp rustpp/examples/hello.rs dist/rustpp/
          tar -C dist -cf - rustpp | xz -T0 -6 > "${NAME}.tar.xz"
          ls -lh "${NAME}.tar.xz"
          echo "file=${NAME}.tar.xz" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-rustpp.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "rustc=$(build/host/stage1/bin/rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Rust++ compiler built from ${GITHUB_SHA}.

          \`${{ steps.pkg.outputs.rustc }}\`

          Usage (Linux x86_64):

          \`\`\`bash
          tar -xJf ${{ steps.pkg.outputs.file }}
          rustup toolchain link rustpp "\$PWD/rustpp"
          rustc +rustpp rustpp/hello.rs && ./hello
          \`\`\`
          EOF
          gh release create "${{ steps.pkg.outputs.tag }}" "${{ steps.pkg.outputs.file }}" \
            --target "$GITHUB_SHA" --title "Rust++ ${{ steps.pkg.outputs.tag }}" \
            --notes-file notes.md --latest

      - name: Run Rust++ UI tests
        run: |
          set -o pipefail
          env -u GITHUB_ACTIONS python3 x.py test tests/ui/rustpp --stage 1 2>&1 | tee test.log

      # Job logs are not always easy to reach, so surface the important
      # parts as annotations on the run.
      - name: Report
        if: always()
        run: |
          report() { # title file lines
            [ -f "$2" ] || return 0
            msg=$(grep -v '^\s*$' "$2" | tail -n "$3" | cut -c1-300 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=$1::$msg"
          }
          grep -nE "^(error|warning: LLVM|Building|Downloading|Build completed)|downloading " build.log 2>/dev/null | head -n 40 > build-key.log || true
          report "build key lines" build-key.log 40
          report "build tail" build.log 60
          report "smoke test" smoke.log 40
          report "ui test tail" test.log 40
          echo "::notice title=disk::$(df -h / | tail -1)"
