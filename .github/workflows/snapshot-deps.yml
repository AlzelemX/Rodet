name: Snapshot dependencies (run once)

# Copies everything the build needs from Rust's servers into this repository's
# `deps-snapshot` release. After this has run, building Rust++ only downloads
# from that release (see rustpp/setup-deps.py), never from rust-lang servers.
#
# Run it manually from the Actions tab. Re-running replaces the snapshot.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Download stage0 compilers (Linux + Windows)
        run: |
          set -euo pipefail
          DATE=$(sed -n 's/^compiler_date=//p' src/stage0)
          VER=$(sed -n 's/^compiler_version=//p' src/stage0)
          SERVER=$(sed -n 's/^dist_server=//p' src/stage0)
          mkdir -p snap
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            for c in rustc rust-std cargo; do
              f="$c-$VER-$t.tar.xz"
              curl -fsSL --retry 3 -o "snap/$f" "$SERVER/dist/$DATE/$f"
              want=$(sed -n "s|^dist/$DATE/$f=||p" src/stage0)
              echo "$want  snap/$f" | sha256sum -c -
            done
          done

      - name: Download prebuilt LLVM (Linux + Windows)
        run: |
          set -euo pipefail
          SHA=$(cat src/ci-llvm-sha)
          SERVER=$(sed -n 's/^artifacts_server=//p' src/stage0)
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            f="rust-dev-nightly-$t.tar.xz"
            curl -fsSL --retry 3 -o "snap/$f" "$SERVER/$SHA/$f"
          done

      - name: Vendor crates.io dependencies
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^compiler_version=//p' src/stage0)
          T=x86_64-unknown-linux-gnu
          mkdir -p /tmp/stage0
          for c in rustc cargo; do
            tar -xJf "snap/$c-$VER-$T.tar.xz" -C /tmp/stage0 --strip-components=2 "$c-$VER-$T/$c"
          done
          export PATH=/tmp/stage0/bin:$PATH RUSTC=/tmp/stage0/bin/rustc RUSTC_BOOTSTRAP=1
          cargo --version
          cargo vendor --locked --sync library/Cargo.toml --sync src/bootstrap/Cargo.toml vendor > /dev/null
          du -sh vendor
          tar -cf - vendor | xz -T0 -6 > snap/vendor.tar.xz

      - name: Publish deps-snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd snap
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -lh
          gh release delete deps-snapshot --yes --cleanup-tag || true
          cat > ../notes.md <<'EOF'
          Build dependencies of Rust++, copied once from Rust's servers so the
          build no longer needs them: stage0 compilers, prebuilt LLVM and
          vendored crates. Used by `rustpp/setup-deps.py`. Not a compiler
          release; see the other releases for that.
          EOF
          gh release create deps-snapshot * --title "Build dependencies snapshot" \
            --notes-file ../notes.md --latest=false
