[package]
name = "rodetc_type_ir"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
derive-where = "1.6.1"
ena = "0.14.4"
indexmap = "2.0.0"
rustc-hash = "2.0.0"
rodetc_abi = { path = "../rodetc_abi", default-features = false }
rodetc_ast_ir = { path = "../rodetc_ast_ir", default-features = false }
rodetc_data_structures = { path = "../rodetc_data_structures", optional = true }
rodetc_error_messages = { path = "../rodetc_error_messages", optional = true }
rodetc_index = { path = "../rodetc_index", default-features = false }
rodetc_macros = { path = "../rodetc_macros", optional = true }
rodetc_serialize = { path = "../rodetc_serialize", optional = true }
rodetc_span = { path = "../rodetc_span", optional = true }
rodetc_type_ir_macros = { path = "../rodetc_type_ir_macros" }
smallvec = { version = "1.8.1", default-features = false, features = [
    "const_generics",
] }
thin-vec = "0.2.21"
tracing = "0.1"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
default = ["nightly"]
nightly = [
    "dep:rodetc_data_structures",
    "dep:rodetc_error_messages",
    "dep:rodetc_macros",
    "dep:rodetc_serialize",
    "dep:rodetc_span",
    "rodetc_ast_ir/nightly",
    "rodetc_index/nightly",
    "rodetc_type_ir_macros/nightly",
    "smallvec/may_dangle",
    "smallvec/union",
    "thin-vec/unstable",
]
# tidy-alphabetical-end
