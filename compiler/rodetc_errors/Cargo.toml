[package]
name = "rodetc_errors"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
annotate-snippets = { version = "0.12.16", features = ["simd"] }
anstream = "0.6.20"
anstyle = "1.0.13"
derive_setters = "0.1.6"
rodetc_ast = { path = "../rodetc_ast" }
rodetc_data_structures = { path = "../rodetc_data_structures" }
rodetc_error_codes = { path = "../rodetc_error_codes" }
rodetc_error_messages = { path = "../rodetc_error_messages" }
rodetc_hashes = { path = "../rodetc_hashes" }
rodetc_index = { path = "../rodetc_index" }
rodetc_lint_defs = { path = "../rodetc_lint_defs" }
rodetc_macros = { path = "../rodetc_macros" }
rodetc_serialize = { path = "../rodetc_serialize" }
rodetc_span = { path = "../rodetc_span" }
serde = { version = "1.0.125", features = ["derive"] }
serde_json = "1.0.59"
termize = "0.2"
tracing = "0.1"
# tidy-alphabetical-end

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
]
