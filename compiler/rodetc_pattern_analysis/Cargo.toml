[package]
name = "rodetc_pattern_analysis"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
rustc-hash = "2.0.0"
rodetc_abi = { path = "../rodetc_abi", optional = true }
rustc_apfloat = "0.2.0"
rodetc_arena = { path = "../rodetc_arena", optional = true }
rodetc_errors = { path = "../rodetc_errors", optional = true }
rodetc_hir = { path = "../rodetc_hir", optional = true }
rodetc_index = { path = "../rodetc_index", default-features = false }
rodetc_lint_defs = { path = "../rodetc_lint_defs", optional = true }
rodetc_macros = { path = "../rodetc_macros", optional = true }
rodetc_middle = { path = "../rodetc_middle", optional = true }
rodetc_span = { path = "../rodetc_span", optional = true }
smallvec = { version = "1.8.1", features = ["union"] }
tracing = "0.1"
# tidy-alphabetical-end

[dev-dependencies]
# tidy-alphabetical-start
tracing-subscriber = { version = "0.3.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-tree = "0.4.1"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
default = ["rustc"]
rustc = [
    "dep:rodetc_abi",
    "dep:rodetc_arena",
    "dep:rodetc_errors",
    "dep:rodetc_hir",
    "dep:rodetc_lint_defs",
    "dep:rodetc_macros",
    "dep:rodetc_middle",
    "dep:rodetc_span",
    "smallvec/may_dangle",
    "rodetc_index/nightly",
]
# tidy-alphabetical-end
