[package]
name = "rodetc_abi"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
bitflags = "2.4.1"
rand = { version = "0.9.0", default-features = false, optional = true }
rand_xoshiro = { version = "0.7.0", optional = true }
rodetc_data_structures = { path = "../rodetc_data_structures", optional = true }
rodetc_error_messages = { path = "../rodetc_error_messages", optional = true }
rodetc_errors = { path = "../rodetc_errors", optional = true }
rodetc_hashes = { path = "../rodetc_hashes" }
rodetc_index = { path = "../rodetc_index", default-features = false }
rodetc_macros = { path = "../rodetc_macros", optional = true }
rodetc_serialize = { path = "../rodetc_serialize", optional = true }
rodetc_span = { path = "../rodetc_span", optional = true }
tracing = "0.1"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
default = ["nightly", "randomize"]
# rust-analyzer depends on this crate and we therefore require it to build on a stable toolchain
# without depending on the rustc_* crates in the following list.
nightly = [
    "dep:rodetc_data_structures",
    "dep:rodetc_error_messages",
    "dep:rodetc_errors",
    "dep:rodetc_macros",
    "dep:rodetc_serialize",
    "dep:rodetc_span",
    "rodetc_index/nightly",
]
randomize = ["dep:rand", "dep:rand_xoshiro", "nightly"]
# tidy-alphabetical-end
