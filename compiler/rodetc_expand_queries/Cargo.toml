[package]
name = "rodetc_expand_queries"
version = "0.0.0"
edition = "2024"
build = false

[lib]
doctest = false

[dependencies]
# tidy-alphabetical-start
rodetc_ast = { path = "../rodetc_ast" }
rodetc_expand = { path = "../rodetc_expand" }
rodetc_middle = { path = "../rodetc_middle" }
# We must use the proc_macro version that we will compile proc-macros against,
# not the one from our own sysroot.
rodetc_proc_macro = { path = "../rodetc_proc_macro" }
rodetc_span = { path = "../rodetc_span" }
scoped-tls = "1.0"
# tidy-alphabetical-end
