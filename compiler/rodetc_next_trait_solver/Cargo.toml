[package]
name = "rodetc_next_trait_solver"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
derive-where = "1.2.7"
rodetc_data_structures = { path = "../rodetc_data_structures", optional = true }
rodetc_index = { path = "../rodetc_index", default-features = false }
rodetc_macros = { path = "../rodetc_macros", optional = true }
rodetc_type_ir = { path = "../rodetc_type_ir", default-features = false }
rodetc_type_ir_macros = { path = "../rodetc_type_ir_macros" }
thin-vec = "0.2.21"
tracing = "0.1"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
default = ["nightly"]
nightly = [
    "dep:rodetc_data_structures",
    "dep:rodetc_macros",
    "rodetc_index/nightly",
    "rodetc_type_ir/nightly",
]
# tidy-alphabetical-end
