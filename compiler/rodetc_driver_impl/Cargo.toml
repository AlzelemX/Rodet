[package]
name = "rodetc_driver_impl"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
anstyle = "1.0.13"
jiff = { version = "0.2.5", default-features = false, features = ["std"] }
rodetc_abi = { path = "../rodetc_abi" }
rodetc_ast = { path = "../rodetc_ast" }
rodetc_ast_pretty = { path = "../rodetc_ast_pretty" }
rodetc_codegen_ssa = { path = "../rodetc_codegen_ssa" }
rodetc_const_eval = { path = "../rodetc_const_eval" }
rodetc_data_structures = { path = "../rodetc_data_structures" }
rodetc_errors = { path = "../rodetc_errors" }
rodetc_expand = { path = "../rodetc_expand" }
rodetc_feature = { path = "../rodetc_feature" }
rodetc_hir = { path = "../rodetc_hir" }
rodetc_hir_analysis = { path = "../rodetc_hir_analysis" }
rodetc_hir_pretty = { path = "../rodetc_hir_pretty" }
rodetc_index = { path = "../rodetc_index" }
rodetc_interface = { path = "../rodetc_interface" }
rodetc_lexer = { path = "../rodetc_lexer" }
rodetc_lint = { path = "../rodetc_lint" }
rodetc_lint_defs = { path = "../rodetc_lint_defs" }
rodetc_log = { path = "../rodetc_log" }
rodetc_macros = { path = "../rodetc_macros" }
rodetc_metadata = { path = "../rodetc_metadata" }
rodetc_middle = { path = "../rodetc_middle" }
rodetc_mir_build = { path = "../rodetc_mir_build" }
rodetc_parse = { path = "../rodetc_parse" }
rodetc_public = { path = "../rodetc_public", features = ["rustc_internal"] }
rodetc_resolve = { path = "../rodetc_resolve" }
rodetc_session = { path = "../rodetc_session" }
rodetc_span = { path = "../rodetc_span" }
rodetc_structures = { path = "../rodetc_structures" }
rodetc_target = { path = "../rodetc_target" }
serde_json = "1.0.59"
shlex = "1.0"
tracing = { version = "0.1.35" }
# tidy-alphabetical-end

[target.'cfg(all(unix, any(target_env = "gnu", target_os = "macos")))'.dependencies]
# tidy-alphabetical-start
libc = "0.2"
# tidy-alphabetical-end

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.0"
features = [
    "Win32_System_Diagnostics_Debug",
]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# tidy-alphabetical-start
ctrlc = "3.4.4"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
check_only = ['rodetc_interface/check_only']
jemalloc = []
llvm = ['rodetc_interface/llvm']
llvm_offload = ['rodetc_interface/llvm_offload']
max_level_info = ['rodetc_log/max_level_info']
rustc_randomized_layouts = [
    'rodetc_index/rustc_randomized_layouts',
    'rodetc_middle/rustc_randomized_layouts'
]
# tidy-alphabetical-end
