[package]
name = "rodetc_public"
version = "0.1.0-preview"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
rodetc_abi = { path = "../rodetc_abi" }
rodetc_crate_store = { path = "../rodetc_crate_store" }
rodetc_hir = { path = "../rodetc_hir" }
rodetc_middle = { path = "../rodetc_middle" }
rodetc_public_bridge = { path = "../rodetc_public_bridge" }
rodetc_span = { path = "../rodetc_span" }
rodetc_target = { path = "../rodetc_target" }
scoped-tls = "1.0"
serde = { version = "1.0.125", features = ["derive"] }
tracing = "0.1"
# tidy-alphabetical-end

[dev-dependencies]
# tidy-alphabetical-start
serde_json = "1.0.142"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
# Provides access to APIs that expose internals of the rust compiler.
# APIs enabled by this feature are unstable. They can be removed or modified
# at any point and they are not included in the crate's semantic versioning.
rustc_internal = []
# tidy-alphabetical-end
