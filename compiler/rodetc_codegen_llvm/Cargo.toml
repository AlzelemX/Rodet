[package]
name = "rodetc_codegen_llvm"
version = "0.0.0"
edition = "2024"

[lib]
test = false

[dependencies]
# tidy-alphabetical-start
bitflags = "2.4.1"
# To avoid duplicate dependencies, this should match the version of gimli used
# by `rodetc_codegen_ssa` via its `thorin-dwp` dependency.
gimli = "0.34"
itertools = "0.15"
libc = "0.2"
libloading = { version = "0.9.0" }
measureme = "12.0.1"
object = { version = "0.39.1", default-features = false, features = ["std", "read"] }
rustc-demangle = "0.1.28"
rodetc_abi = { path = "../rodetc_abi" }
rodetc_ast = { path = "../rodetc_ast" }
rodetc_attr_ir = { path = "../rodetc_attr_ir" }
rodetc_codegen_ssa = { path = "../rodetc_codegen_ssa" }
rodetc_crate_store = { path = "../rodetc_crate_store" }
rodetc_data_structures = { path = "../rodetc_data_structures" }
rodetc_errors = { path = "../rodetc_errors" }
rodetc_fs_util = { path = "../rodetc_fs_util" }
rodetc_hashes = { path = "../rodetc_hashes" }
rodetc_hir = { path = "../rodetc_hir" }
rodetc_index = { path = "../rodetc_index" }
rodetc_lint_defs = { path = "../rodetc_lint_defs" }
rodetc_llvm = { path = "../rodetc_llvm" }
rodetc_macros = { path = "../rodetc_macros" }
rodetc_metadata = { path = "../rodetc_metadata" }
rodetc_middle = { path = "../rodetc_middle" }
rodetc_sanitizers = { path = "../rodetc_sanitizers" }
rodetc_session = { path = "../rodetc_session" }
rodetc_span = { path = "../rodetc_span" }
rodetc_structures = { path = "../rodetc_structures" }
rodetc_symbol_mangling = { path = "../rodetc_symbol_mangling" }
rodetc_target = { path = "../rodetc_target" }
smallvec = { version = "1.8.1", features = ["union", "may_dangle"] }
tracing = "0.1"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
check_only = ["rodetc_llvm/check_only"]
llvm_offload = []
# tidy-alphabetical-end

