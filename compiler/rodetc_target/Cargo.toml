edition = "2024"

[dependencies]
# tidy-alphabetical-start
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
object = { version = "0.39.1", default-features = false, features = ["elf", "macho"] }
rodetc_abi = { path = "../rodetc_abi" }
