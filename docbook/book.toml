[book]
title = "The Rust++ Doc Book"
description = "How to write Rust++: a faster to read, easier to learn Rust."
authors = ["AlzelemX"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/AlzelemX/Rust-/tree/main/docbook"
edit-url-template = "https://github.com/AlzelemX/Rust-/edit/main/docbook/{path}"
additional-css = ["theme/rustpp.css"]
site-url = "/Rust-/"

# play.rust-lang.org runs normal Rust, not Rust++: no "Run" buttons.
[output.html.playground]
runnable = false
copyable = true

[output.html.search]
enable = true
